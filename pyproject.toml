[project]
name = "gemfinder-ai"
version = "0.1.0"
description = "AI-powered Solana token discovery and research platform (Pump.fun focused)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "integration: tests that need PostgreSQL and Redis (set TEST_DATABASE_URL / TEST_REDIS_URL)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions", "extension"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "ASYNC109"]
