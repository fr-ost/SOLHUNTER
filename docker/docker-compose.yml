# Local development stack (NOT used by Railway). Run from the repo root:
#   docker compose -f docker/docker-compose.yml up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: solhunter
      POSTGRES_PASSWORD: solhunter
      POSTGRES_DB: solhunter
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solhunter"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]

  solhunter:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      SERVICE_ROLE: all
      DATABASE_URL: postgresql://solhunter:solhunter@postgres:5432/solhunter
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS_ON_START: "true"
      PORT: "8080"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
